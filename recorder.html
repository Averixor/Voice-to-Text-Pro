<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recorder — Voice to Text Pro</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .rec-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-5);
        position: relative;
        z-index: 1;
      }

      .rec-card {
        width: 100%;
        max-width: 380px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--space-6);
        backdrop-filter: blur(12px);
      }

      .rec-card h1 {
        margin: 0 0 var(--space-3);
        font-size: 1.15rem;
      }

      .rec-card p {
        margin: 0 0 var(--space-4);
        color: var(--text-secondary);
        line-height: 1.55;
      }

      .rec-card .control-btn {
        width: 100%;
      }

      .rec-status {
        margin-top: var(--space-4);
        padding: var(--space-3);
        border-radius: var(--radius-md);
        font-size: 13px;
        line-height: 1.45;
        display: none;
      }

      .rec-status.is-ok {
        display: block;
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.35);
        color: #6ee7b7;
      }

      .rec-status.is-live {
        display: block;
        background: rgba(99, 102, 241, 0.18);
        border: 1px solid rgba(99, 102, 241, 0.4);
        color: #c7d2fe;
      }

      .rec-status.is-err {
        display: block;
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.35);
        color: #fca5a5;
      }

      .rec-note {
        margin-top: var(--space-4);
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.45;
      }

      .rec-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
        margin-right: 8px;
        animation: rec-pulse 1.2s ease-in-out infinite;
      }

      @keyframes rec-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .rec-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="animated-bg" aria-hidden="true">
      <div class="gradient-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
      </div>
    </div>

    <main class="rec-page">
      <section class="rec-card">
        <h1 id="recHeading">Microphone</h1>
        <p id="recBody">
          Speech recognition runs in this extension tab (not in the side panel
          and not on the website).
        </p>
        <button type="button" class="control-btn primary-btn" id="recAllowBtn">
          <span id="recAllowLabel">Allow microphone</span>
        </button>
        <div
          id="recStatus"
          class="rec-status"
          role="status"
          aria-live="polite"
        ></div>
        <p id="recNote" class="rec-note">
          Background leftmost tab for speech recognition. Microphone permission
          is requested from the side panel on your page — this tab stays in the
          background. It closes automatically on Stop.
        </p>
      </section>
    </main>

    <script src="i18n.js"></script>
    <script src="recorder.js"></script>
  </body>
</html>
