<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microphone — Voice to Text Pro</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .mic-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-6);
        position: relative;
        z-index: 1;
      }

      .mic-card {
        width: 100%;
        max-width: 380px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--space-6);
        backdrop-filter: blur(12px);
      }

      .mic-card h1 {
        margin: 0 0 var(--space-3);
        font-size: 1.25rem;
      }

      .mic-card p {
        margin: 0 0 var(--space-4);
        color: var(--text-secondary);
        line-height: 1.55;
      }

      .mic-status {
        margin: var(--space-4) 0 0;
        padding: var(--space-3);
        border-radius: var(--radius-md);
        font-size: 13px;
        line-height: 1.45;
        display: none;
      }

      .mic-status.is-ok {
        display: block;
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.35);
        color: #6ee7b7;
      }

      .mic-status.is-err {
        display: block;
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.35);
        color: #fca5a5;
      }

      .mic-card .control-btn {
        width: 100%;
      }

      .mic-note {
        margin-top: var(--space-4);
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <div class="animated-bg" aria-hidden="true">
      <div class="gradient-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
      </div>
    </div>

    <main class="mic-page">
      <section class="mic-card">
        <h1 id="micHeading">Allow microphone</h1>
        <p id="micBody">
          Grant the microphone to this extension once. Chrome will remember the
          choice. Websites in other tabs are not affected.
        </p>
        <button type="button" class="control-btn primary-btn" id="micAllowBtn">
          <span id="micAllowLabel">Allow microphone</span>
        </button>
        <div
          id="micStatus"
          class="mic-status"
          role="status"
          aria-live="polite"
        ></div>
        <p id="micNote" class="mic-note">
          After allowing, close this window and press Start in the side panel.
        </p>
      </section>
    </main>

    <script src="i18n.js"></script>
    <script src="mic-permission.js"></script>
  </body>
</html>
